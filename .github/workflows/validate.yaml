name: Validate

on:
  push:
  pull_request:
  schedule:
    # Catches breakage from new Home Assistant releases without a push.
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # The brands check requires assets in home-assistant/brands, which
          # only matters for inclusion in the HACS default store. Installing
          # this as a custom repository does not need them.
          ignore: brands
